name: Daily extract players

on:
  schedule:
    # Note: GitHub Actions schedule times are UTC.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth pandas

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Run extractor
        env:
          GCP_WORKLOAD_IDENTITY: "1"
          SOURCE_FOLDER_ID: ${{ secrets.SOURCE_FOLDER_ID }}
          SOURCE_EXT: .db
          CLUBGG_OUTPUT_CSV: players_id_clubgg.csv
          7XL_OUTPUT_CSV: players_id_7xl.csv
        run: python extract-players-id.py

      - name: Commit and push CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add players_id_clubgg.csv players_id_7xl.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily extraction $(date +%Y-%m-%d)"
            git push
          fi
